services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epilot
      POSTGRES_PASSWORD: epilot
      POSTGRES_DB: epilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://epilot:epilot@postgres:5432/epilot"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
