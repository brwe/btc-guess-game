services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: ["bun", "--watch", "src/server.ts"]
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres"
      GUESS_DURATION_SECONDS: "${GUESS_DURATION_SECONDS:-60}"
      COINBASE_WEBSOCKET_URL: "${COINBASE_WEBSOCKET_URL:-wss://ws-feed.exchange.coinbase.com}"
      COINBASE_TICKER_CHANNEL: "${COINBASE_TICKER_CHANNEL:-ticker_batch}"
      RESET_DATABASE_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: ["bun", "run", "dev", "--", "--port", "3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
